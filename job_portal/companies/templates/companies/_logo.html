{% if company.logo %}<img class="logo-box" src="{{ company.logo.url }}" alt="{{ company.name }} logo" width="{{ size|default:56 }}" height="{{ size|default:56 }}" style="width:{{ size|default:56 }}px;height:{{ size|default:56 }}px" loading="lazy">{% else %}<div class="logo-box logo-initials" style="width:{{ size|default:56 }}px;height:{{ size|default:56 }}px" aria-hidden="true">{{ company.initials }}</div>{% endif %}
