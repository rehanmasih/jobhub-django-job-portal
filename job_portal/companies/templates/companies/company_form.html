{% extends "base.html" %}
{% block title %}Company profile — JOBHUB{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1 class="h3 mb-0">{% if company %}Edit company profile{% else %}Create your company profile{% endif %}</h1></div></div>
<div class="container"><div class="row"><div class="col-lg-9">
  <form method="post" enctype="multipart/form-data" class="card-jh card-static p-4" novalidate>{% csrf_token %}
    {% include "partials/form.html" with form=form %}
    <button class="btn btn-primary mt-4" type="submit">Save company</button>
  </form>
</div></div></div>
{% endblock %}
