{% extends "base.html" %}
{% block title %}Login — JOBHUB{% endblock %}
{% block content %}
<div class="container section"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card-jh card-static p-4">
    <h1 class="h4 mb-1">Welcome back</h1>
    <p class="text-muted-jh">Log in to continue to JOBHUB.</p>
    <form method="post" novalidate>{% csrf_token %}
      {% include "partials/form.html" with form=form %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100 mt-3" type="submit">Login</button>
    </form>
    <hr>
    <p class="mb-0 small">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
  </div>
</div></div></div>
{% endblock %}
