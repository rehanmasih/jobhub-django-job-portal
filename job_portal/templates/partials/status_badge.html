<span class="status-badge badge-{{ status }}">{% if status == 'active' or status == 'accepted' %}<i class="bi bi-check-circle" aria-hidden="true"></i>{% elif status == 'rejected' or status == 'closed' or status == 'expired' %}<i class="bi bi-x-circle" aria-hidden="true"></i>{% elif status == 'shortlisted' %}<i class="bi bi-star" aria-hidden="true"></i>{% else %}<i class="bi bi-clock" aria-hidden="true"></i>{% endif %} {{ label }}</span>
